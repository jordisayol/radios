<!DOCTYPE html>
<html lang="ca">

	<head>
		<!-- CRUCIAL PARA MÓVIL -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Emissores Països Catalans</title>
		<link rel="icon" href="web_radio.png" type="image/png">
		<meta charset="utf-8">
		<style>
			body { font-family: Arial; padding: 20px; }
			.contenidor { display: flex; flex-wrap: wrap; }
			
			/* La caixa ara només distribueix l'espai */
			.caixa { flex: 1 1 100%; box-sizing: border-box; font-size:7vw; text-align: center;}

			/* L'enllaç ocupa tot el quadre, té el padding, el fons i el text blau fosc */
			.caixa a {
				display: block;
				padding: 20px;
				text-decoration: none; /* Treu el subratllat */
				color: #0000c0;       /* Text en blau */
				font-weight: bold;
			}

			/* Escritorio: a partir de 768px */
			@media (min-width: 768px) {
				.caixa { flex: 1 1 50%; font-size:5vw; text-align: center;} /* Dos columnas */
			}
			p {
				font-size:6vw;
				text-align: center;
				color: #000000;
			}
		</style>
	</head>

	<body>
		<p>
		<b>Emissores Països Catalans</b>
		</p>
		<div class="contenidor">
			<div class="caixa"><a href="catradio.m3u8" style="background-color:lightgreen;">Catalunya Ràdio</a></div>
			<div class="caixa"><a href="rac1.m3u8" style="background-color:rgb(247, 219, 145);">RAC1</a></div>
			<div class="caixa"><a href="tv3.m3u8" style="background-color:lightcoral;">TV3</a></div>
			<div class="caixa"><a href="varies.m3u8" style="background-color:lightblue;">Països Catalans</a></div>
		</div>
	</body>

</html>
